<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<title>2026 KSA 한마당체육대회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<script>

  storageBucket: "ksa-sports-2026-info.firebasestorage.app",
  messagingSenderId: "492496709588",
  appId: "1:492496709588:web:a208bd6d9c51a03e069841"

<style>
:root{
  --ink:#14213D; --ink2:#414C68; --paper:#EEF1F5; --card:#FFFFFF; --line:#D9DEE7;
  --track:#B5452F; --track2:#9C3A27;
  --cj:#F2BE00; --yj:#22A04B; --tg:#1E66E0; --hs:#E0303A;
  --cj-t:#5A4600; --live:#E0303A;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--tg);outline-offset:2px;border-radius:6px}
.num{font-family:Oswald,Pretendard,sans-serif;font-variant-numeric:tabular-nums}
.disp{font-family:"Black Han Sans",Pretendard,sans-serif;font-weight:400;letter-spacing:-.01em}

/* header */
header{background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 18px 0;position:relative;overflow:hidden}
header .eyebrow{font-size:12px;letter-spacing:.14em;opacity:.7;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:27px;line-height:1.1;margin:4px 0 3px}
header h1 small{display:block;font-size:14px;font-family:Pretendard;font-weight:600;opacity:.75;margin-bottom:1px}
header .byline{text-align:right;font-family:Oswald;font-size:12px;font-weight:500;letter-spacing:.12em;opacity:.8;margin:3px 2px 8px;text-transform:lowercase}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.02em;background:rgba(255,255,255,.12);padding:4px 9px;border-radius:99px}
.conn i{width:7px;height:7px;border-radius:50%;background:#9AA3B5}
.conn.on i{background:#4ADE80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.stripe{height:8px;display:flex}
.stripe span{flex:1}

main{max-width:640px;margin:0 auto;padding:8px 12px 12px;display:flex;flex-direction:column;min-height:calc(100dvh - 100px);overflow:hidden}
section.view{display:none;flex-direction:column}
section.view.on{flex:1;display:flex;flex-direction:column;min-height:0;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
h2{font-size:12.5px;letter-spacing:.08em;color:var(--ink2);font-weight:800;margin:8px 4px 5px;display:flex;justify-content:space-between;align-items:baseline}
h2:first-child{margin-top:2px}
h2 a{font-size:12px;color:var(--tg);letter-spacing:0;font-weight:600;cursor:pointer}
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:0 1px 0 var(--line)}

/* notice banner */
.notice{display:flex;gap:10px;align-items:center;background:#B42318;color:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:0 4px 14px rgba(180,35,24,.28)}
.notice .bl{display:inline-flex;align-items:center;gap:5px;background:#fff;color:#B42318;font-size:12px;font-weight:900;letter-spacing:.14em;padding:4px 9px;border-radius:8px;white-space:nowrap;flex-shrink:0}
.notice .bl i{width:7px;height:7px;border-radius:50%;background:#B42318;animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:.15}}
.notice p{font-size:14.5px;line-height:1.4;flex:1;word-break:keep-all;font-weight:700}
.notice time{display:block;font-size:11px;color:rgba(255,255,255,.8);margin-top:2px;font-weight:500}

/* now / next */
.nowcard{background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;position:relative;overflow:hidden}
.nowcard .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.1em;color:#FF8A8F}
.nowcard .tag i{width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.nowcard .title{font-size:24px;margin:3px 0 2px;line-height:1.1;word-break:keep-all}
.nowcard .meta{font-size:14px;opacity:.78;line-height:1.4}
.nextcard{display:flex;align-items:center;gap:12px;margin-top:7px;padding:11px 14px}
.nextcard .lbl{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--track);min-width:38px}
.nextcard .t{font-size:16px;font-weight:700}
.nextcard .m{font-size:12px;color:var(--ink2);margin-top:1px}

/* track scoreboard — signature */
.track{background:var(--track);border-radius:14px;padding:6px 0 8px;position:relative;overflow:hidden}
.track .hd{display:flex;justify-content:space-between;color:#fff;font-size:11.5px;letter-spacing:.1em;padding:2px 12px 5px;opacity:.9}
.lane{position:relative;height:41px;border-top:2px dashed rgba(255,255,255,.55);display:flex;align-items:center}
.lane:last-child{border-bottom:2px dashed rgba(255,255,255,.55)}
.lane .no small{font-size:11px;font-family:Pretendard;margin-left:1px}
.lane .no{width:38px;text-align:center;color:rgba(255,255,255,.9);font-size:18px;font-family:Oswald}
.lane .run{position:relative;flex:1;height:34px;margin-right:10px}
.lane .bar{position:absolute;left:0;top:0;bottom:0;border-radius:9px;min-width:92px;display:flex;align-items:center;justify-content:space-between;padding:0 11px;transition:width .9s cubic-bezier(.2,.8,.2,1);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.lane .bar .nm{font-size:15.5px;color:#fff}
.lane .bar .sc{font-size:19px;font-weight:700;color:#fff}
.lane .bar.cj .nm,.lane .bar.cj .sc{color:var(--cj-t)}
.lane .medal{position:absolute;right:-6px;top:-8px;background:#fff;color:var(--ink);font-size:11px;font-weight:800;border-radius:99px;padding:2px 7px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.bg-cj{background:var(--cj)}.bg-yj{background:var(--yj)}.bg-tg{background:var(--tg)}.bg-hs{background:var(--hs)}
.finish{position:absolute;right:12px;top:30px;bottom:12px;width:6px;background:repeating-linear-gradient(#fff 0 6px,#14213D 6px 12px);opacity:.5;border-radius:2px}
.updated{font-size:12px;color:var(--ink2);text-align:right;margin:6px 4px 0}

/* matrix */
.matrix{width:100%;border-collapse:separate;border-spacing:0;font-size:15px}
.matrix th,.matrix td{padding:10px 4px;text-align:center;border-bottom:1px solid var(--line)}
.matrix th:first-child,.matrix td:first-child{text-align:left;padding-left:2px;font-weight:600;word-break:keep-all}
.matrix thead th{font-size:13px;font-weight:800;border-bottom:3px solid var(--c)}
.matrix td.num{font-size:17px}
.matrix tr.live td:first-child::after{content:"LIVE";white-space:nowrap;display:inline-block;line-height:1.3;font-size:9px;font-weight:800;color:#fff;background:var(--live);border-radius:4px;padding:1px 4px;margin-left:5px;vertical-align:2px}
.matrix tr.total td{font-weight:800;border-bottom:0;font-size:15px}
.matrix tr.total td.num{font-size:20px}
.matrix .grp{font-size:11px;color:var(--ink2);font-weight:600;display:block}

/* schedule */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.step{position:relative;padding:3px 0 10px}
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.step::before{content:"";position:absolute;left:-20px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid #A8B0C2}
.step.done::before{background:#A8B0C2}
.step.now::before{background:var(--live);border-color:var(--live);box-shadow:0 0 0 5px rgba(224,48,58,.18)}
.step .time{font-size:13.5px;color:var(--ink2)}
.step .tt{font-size:16px;font-weight:700;margin-top:1px}
.step.done .tt{color:#69738E}
.step .subs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.chip.now{background:var(--live);border-color:var(--live);color:#fff;font-weight:700}
.chip.done{color:#69738E;text-decoration:line-through}
.step .note{font-size:12px;color:var(--ink2);margin-top:5px}

/* teams */
#teamList{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{border-radius:14px;background:var(--card);overflow:hidden;margin-bottom:0;box-shadow:0 1px 0 var(--line)}
.team .top{padding:8px 11px;display:flex;justify-content:space-between;align-items:center;color:#fff}
.team .top.cj{color:var(--cj-t)}
.team .top .disp{font-size:19px}
.team .top .rk{font-size:11px;font-weight:700;background:rgba(255,255,255,.25);padding:2px 8px;border-radius:99px}
.team .body{padding:8px 11px 10px;display:grid;grid-template-columns:40px 1fr;gap:4px 7px;font-size:13px;line-height:1.42}
.team .body dt{color:var(--ink2);font-size:11.5px;font-weight:700;padding-top:2px}
.team .body dd{word-break:keep-all}
.finder{display:flex;gap:8px;margin-bottom:10px}
.finder select{flex:1;font:inherit;font-size:15px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.found{font-size:14.5px;padding:9px 12px;border-radius:12px;margin-bottom:10px;font-weight:700;display:none}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid #C7CEDB;box-shadow:0 -6px 20px rgba(20,33,61,.12);display:flex;gap:2px;padding:5px 5px calc(5px + env(safe-area-inset-bottom));z-index:10}
nav.tabs button{flex:1;position:relative;border-radius:13px;padding:8px 0 7px;font-size:12.5px;font-weight:700;color:#414C68;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:24px;height:24px;stroke-width:2.2;color:var(--tc,#414C68)}
nav.tabs button span.lb{color:var(--tc,#414C68);opacity:.82}
nav.tabs button.on{background:var(--tint,#EDEFF4)}
nav.tabs button.on span.lb{opacity:1;color:var(--tc)}
nav.tabs button.on::before{content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:34px;height:4px;border-radius:0 0 4px 4px;background:var(--tc)}

/* toast */
.toast{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));max-width:616px;margin:0 auto;background:var(--ink);color:#fff;border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.45;box-shadow:0 10px 30px rgba(20,33,61,.35);z-index:50;transform:translateY(-140%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.toast.show{transform:none}
.toast b{display:block;font-size:11px;letter-spacing:.1em;color:#FFD15C;margin-bottom:3px}
.bell{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink2);margin-top:8px;padding:8px 11px;border:1px dashed #B9C0CF;border-radius:12px}
.admEntry{width:100%;margin-top:8px;padding:9px;font-size:13px;font-weight:700;color:#8A93A8;background:none;border-radius:12px;text-align:center}
.bell button{background:var(--ink);color:#fff;padding:8px 12px;border-radius:10px;font-size:13px;font-weight:700;white-space:nowrap}

/* admin */
.adm label{font-size:12px;font-weight:700;color:var(--ink2);display:block;margin:0 0 6px}
.adm input[type=text],.adm input[type=password],.adm input[type=email],.adm textarea,.adm select{width:100%;font:inherit;font-size:15px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.adm textarea{min-height:76px;resize:vertical}
.btn{background:var(--ink);color:#fff;font-weight:700;padding:12px 16px;border-radius:12px;font-size:15px}
.btn.ghost{background:#E3E7EE;color:var(--ink)}
.btn.red{background:var(--live)}
.row{display:flex;gap:8px;align-items:center}
.score-grid{display:grid;grid-template-columns:1fr repeat(4,1fr);gap:6px;align-items:center;font-size:14px}
.score-grid .h{font-weight:800;text-align:center;padding:6px 0;border-radius:8px;color:#fff;font-size:13px}
.score-grid .h.cj{color:var(--cj-t)}
.score-grid input{width:100%;font:inherit;font-family:Oswald;font-size:18px;text-align:center;padding:9px 2px;border:1px solid var(--line);border-radius:10px;background:#fff}
.score-grid .ev{font-weight:600;word-break:keep-all;line-height:1.25}
.steps-admin button{display:block;width:100%;text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;margin-bottom:6px;font-size:15px}
.steps-admin button.on{background:var(--live);border-color:var(--live);color:#fff;font-weight:700}
.nlist .it{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.nlist .it p{flex:1;word-break:keep-all}
.nlist .it button{color:var(--live);font-size:12px;font-weight:700}
.hint{font-size:13px;color:var(--ink2);line-height:1.55;margin-top:8px}
.mode{font-size:13px;padding:10px 12px;border-radius:12px;background:#E6EEFD;color:#173E8C;line-height:1.5;margin-bottom:12px}
.mode.demo{background:#FFF1D6;color:#6B4A00}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<header>
  <div class="eyebrow"><span>KOREA SCIENCE ACADEMY OF KAIST</span><span class="conn" id="conn"><i></i><span>연결 중</span></span></div>
  <h1 class="disp"><small>2026학년도</small>KSA 한마당체육대회</h1>
  <div class="byline">by jwj</div>
  <div class="stripe"><span class="bg-cj"></span><span class="bg-yj"></span><span class="bg-tg"></span><span class="bg-hs"></span></div>
</header>

<main>
  <!-- HOME -->
  <section class="view on" id="v-home">
    <div id="noticeTop"></div>
    <h2>지금 진행 중</h2>
    <div class="nowcard" id="nowCard"></div>
    <div class="card nextcard" id="nextCard"></div>
    <h2>실시간 종합 순위 <a data-go="score">종목별 점수 보기</a></h2>
    <div id="trackHome"></div>
    <div class="bell" id="bellBox">
      <span>새 공지가 올라오면 이 화면에서 알림을 받습니다.</span>
      <button id="bellBtn">알림 켜기</button>
    </div>
    <button class="admEntry" id="admEntry">⚙ 운영자 화면</button>
  </section>

  <!-- SCORE -->
  <section class="view" id="v-score">
    <h2>종합 순위</h2>
    <div id="trackScore"></div>
    <h2>종목별 점수판</h2>
    <div class="card" style="padding:8px 12px"><table class="matrix" id="matrix"></table></div>
  </section>

  <!-- SCHEDULE -->
  <section class="view" id="v-sched">
    <h2>경기 일정 <span id="dateLbl" style="letter-spacing:0;font-weight:600"></span></h2>
    <div class="card"><div class="tl" id="timeline"></div></div>
  </section>

  <!-- TEAMS -->
  <section class="view" id="v-team">
    <h2>우리 반은 무슨 팀?</h2>
    <div class="finder">
      <select id="fGrade" aria-label="학년">
        <option value="">학년</option><option>1학년</option><option>2학년</option><option>3학년</option><option>RAA</option>
      </select>
      <select id="fClass" aria-label="반"><option value="">반</option></select>
    </div>
    <div class="found" id="found"></div>
    <h2>팀 구분</h2>
    <div id="teamList"></div>
  </section>

  <!-- NOTICES -->
  <section class="view" id="v-notice">
    <h2>공지사항</h2>
    <div id="noticeAll"></div>
  </section>

  <!-- ADMIN -->
  <section class="view adm" id="v-admin">
    <h2>운영자 화면</h2>
    <div id="modeBox"></div>
    <div id="loginBox" class="card">
      <div id="loginFb">
        <label for="aEmail">운영자 이메일</label>
        <input type="email" id="aEmail" autocomplete="username" style="margin-bottom:10px">
        <label for="aPw">비밀번호</label>
        <input type="password" id="aPw" autocomplete="current-password">
      </div>
      <div id="loginDemo">
        <label for="aPin">체험 모드 PIN</label>
        <input type="password" id="aPin" inputmode="numeric" placeholder="2026">
      </div>
      <button class="btn" id="loginBtn" style="width:100%;margin-top:12px">운영자 로그인</button>
      <p class="hint" id="loginErr"></p>
    </div>

    <div id="adminBox" style="display:none">
      <h2>① 진행 단계 바꾸기</h2>
      <div class="card">
        <div class="steps-admin" id="stepsAdmin"></div>
        <div class="row" style="margin-top:6px"><button class="btn ghost" id="prevStep" style="flex:1">◀ 이전</button><button class="btn" id="nextStep" style="flex:2">다음 경기로 ▶</button></div>
      </div>

      <h2>② 종목별 점수 입력</h2>
      <div class="card">
        <div class="score-grid" id="scoreGrid"></div>
        <p class="hint">숫자를 고치고 칸을 벗어나면 즉시 모든 화면에 반영됩니다. 종합점수는 자동 합산됩니다.</p>
      </div>

      <h2>③ 공지 보내기</h2>
      <div class="card">
        <label for="nText">공지 내용</label>
        <textarea id="nText" placeholder="예) 전략 줄다리기 5분 뒤 시작합니다. 대운동장으로 모여 주세요."></textarea>
        <div class="row" style="margin-top:10px">
          <select id="nLevel" style="flex:1"><option value="info">일반 공지</option><option value="urgent">긴급 공지</option></select>
          <button class="btn" id="nSend" style="flex:1">공지 보내기</button>
        </div>
        <div class="nlist" id="nAdminList" style="margin-top:10px"></div>
      </div>

      <h2>④ 기타</h2>
      <div class="card">
        <label for="dateIn">행사 날짜 표시</label>
        <div class="row"><input type="text" id="dateIn" placeholder="예) 2026.11.00(금)"><button class="btn ghost" id="dateSave">저장</button></div>
        <div class="row" style="margin-top:14px"><button class="btn red" id="resetAll" style="flex:1">점수·공지 전체 초기화</button><button class="btn ghost" id="logout" style="flex:1">로그아웃</button></div>
      </div>
    </div>
  </section>
</main>

<nav class="tabs" aria-label="메뉴">
  <button data-go="home" class="on" style="--tc:#E0303A;--tint:#FDE9EA"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="lb">홈</span></button>
  <button data-go="score" style="--tc:#1E66E0;--tint:#E7EEFD"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 20V10M12 20V4M18 20v-7"/></svg><span class="lb">점수</span></button>
  <button data-go="sched" style="--tc:#1D9E4C;--tint:#E4F5EB"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="lb">일정</span></button>
  <button data-go="team" style="--tc:#C79000;--tint:#FFF3D4"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.6c2.8-.3 5 1.4 5.5 4.4"/></svg><span class="lb">팀</span></button>
  <button data-go="notice" style="--tc:#7A4FBF;--tint:#F0EAFB"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 21h4"/></svg><span class="lb">공지</span></button>
</nav>

<script>
/* ---------------- 대회 기본 데이터 (출력물 기준) ---------------- */
const TEAMS=[
  {id:'cj',name:'창조',color:'var(--cj)',cls:{'1학년':[1,2,3],'2학년':[1,2,3],'3학년':[1,2,3]},staff:['수리정보과학부','입학진로팀','교무연구부']},
  {id:'yj',name:'예지',color:'var(--yj)',cls:{'1학년':[4,5,6],'2학년':[4,5,6],'3학년':[4,5,6]},staff:['물리지구과학부','행정지원부']},
  {id:'tg',name:'탐구',color:'var(--tg)',cls:{'1학년':[7,8,9],'2학년':[7,8,9],'3학년':[7,8,9]},staff:['화학생물학부','학생생활부']},
  {id:'hs',name:'형설',color:'var(--hs)',cls:{'1학년':[10],'2학년':[10],'3학년':[10],'RAA':[1,2,3,4,5,6]},staff:['인문예술학부','대외기획부']}
];
const EVENTS=[
  {id:'wave',name:'파도타기',grp:'단체종목'},
  {id:'notdari',name:'놋다리밟기',grp:'단체종목'},
  {id:'tug',name:'전략줄다리기',grp:'단체종목'},
  {id:'rope',name:'단체줄넘기',grp:'반대항'},
  {id:'crelay',name:'협동릴레이',grp:'반대항'},
  {id:'relay',name:'이어달리기',grp:''}
];
/* 진행 단계: 순서(block) 안의 세부 경기까지 */
const BLOCKS=[
  {no:1,time:'09:00 ~ 09:10',title:'개회식',steps:[{t:'개회식'}]},
  {no:2,time:'09:10 ~ 09:20',title:'준비운동',steps:[{t:'준비운동'}]},
  {no:3,time:'09:20 ~ 10:10',title:'단체종목',note:'팀 전원',steps:[{t:'파도타기',ev:'wave'},{t:'놋다리밟기',ev:'notdari'},{t:'전략 줄다리기',ev:'tug'}]},
  {no:4,time:'10:10 ~ 11:10',title:'반대항경기',note:'반 별로 전원',steps:[{t:'단체줄넘기',ev:'rope'},{t:'협동릴레이',ev:'crelay'}]},
  {no:5,time:'11:10 ~ 12:10',title:'사제 친선 축구',note:'전·후반 각 20분 · 하프타임 프리즈비',steps:[{t:'사제 친선 축구'}]},
  {no:6,time:'12:10 ~ 12:30',title:'이어달리기',note:'학생 남6/여3 · 교직원 남4/여2',steps:[{t:'이어달리기',ev:'relay'}]},
  {no:7,time:'12:30 ~ 12:40',title:'폐회식',note:'순위발표 · 상품수여',steps:[{t:'폐회식'}]}
];
const STEPS=[];BLOCKS.forEach(b=>b.steps.forEach(s=>STEPS.push({...s,block:b})));

/* ---------------- 상태 ---------------- */
let S={current:-1,scores:{},notices:{},date:'',updated:0};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sc=(ev,t)=>Number((S.scores[ev]||{})[t]||0);
const total=t=>EVENTS.reduce((a,e)=>a+sc(e.id,t),0);
function ranking(){
  const arr=TEAMS.map(t=>({...t,score:total(t.id)})).sort((a,b)=>b.score-a.score);
  arr.forEach((t,i)=>t.rank=(i>0&&t.score===arr[i-1].score)?arr[i-1].rank:i+1);
  return arr;
}
const fmtTime=ms=>{if(!ms)return'';const d=new Date(ms);return d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})};

/* ---------------- 렌더링 ---------------- */
function trackHTML(){
  const rk=ranking(),max=Math.max(1,...rk.map(t=>t.score)),anyScore=rk.some(t=>t.score>0);
  const order=anyScore?rk:TEAMS.map(t=>({...t,score:0,rank:'-'})); // 순위 순으로 레인 배치
  return `<div class="track"><div class="hd"><span>순위</span><span>${anyScore?'종합점수':'경기 시작 전'}</span></div>`+
    order.map((t,i)=>{const w=anyScore?Math.max(28,t.score/max*100):28;
      return `<div class="lane"><div class="no">${anyScore?t.rank:'·'}<small>${anyScore?'위':''}</small></div><div class="run">
      <div class="bar bg-${t.id} ${t.id}" style="width:${w}%"><span class="nm disp">${t.name}</span><span class="sc num">${t.score}</span></div></div></div>`}).join('')+
    `</div><p class="updated">${S.updated?'마지막 반영 '+fmtTime(S.updated):''}</p>`;
}
function renderHome(){
  const cur=S.current, now=STEPS[cur], nx=STEPS[cur+1];
  const hasN=Object.keys(S.notices||{}).length>0;
  $('bellBox').style.display=hasN?'none':'';
  if(cur<0){ $('nowCard').innerHTML=`<span class="tag" style="color:#9DB4FF">대회 시작 전</span><div class="title disp">개회식</div><div class="meta">곧 시작됩니다 · ${esc(S.date||'')} 09:00</div>`;}
  else if(cur>=STEPS.length){ $('nowCard').innerHTML=`<span class="tag" style="color:#9DB4FF">대회 종료</span><div class="title disp">모든 경기가 끝났습니다</div><div class="meta">최종 순위를 확인하세요</div>`;}
  else { $('nowCard').innerHTML=`<span class="tag"><i></i>LIVE · ${now.block.no}부 ${esc(now.block.title)}</span><div class="title disp">${esc(now.t)}</div><div class="meta">${now.block.time}${now.block.note?' · '+esc(now.block.note):''}</div>`;}
  const n = cur<0?STEPS[0]:nx;
  $('nextCard').innerHTML = n ? `<span class="lbl">다음<br>경기</span><div><div class="t">${esc(n.t)}</div><div class="m">${n.block.time} · ${esc(n.block.title)}${n.block.note?' · '+esc(n.block.note):''}</div></div>`
    : `<span class="lbl">다음</span><div><div class="t">남은 경기가 없습니다</div></div>`;
  $('trackHome').innerHTML=trackHTML();
  const ns=noticeArr();
  $('noticeTop').innerHTML = ns.length? noticeHTML(ns[0]) : '';
}
function noticeArr(){return Object.entries(S.notices||{}).map(([k,v])=>({id:k,...v})).sort((a,b)=>b.time-a.time)}
function noticeHTML(n){return `<div class="notice"><span class="bl"><i></i>공지</span><p>${esc(n.text)}<time>${fmtTime(n.time)}</time></p></div>`}
function renderScore(){
  $('trackScore').innerHTML=trackHTML();
  const liveEv=(STEPS[S.current]||{}).ev, rk=ranking();
  let h=`<thead><tr><th>종목</th>${TEAMS.map(t=>`<th style="--c:${t.color}">${t.name}</th>`).join('')}</tr></thead><tbody>`;
  EVENTS.forEach(e=>{h+=`<tr class="${e.id===liveEv?'live':''}"><td>${e.name}${e.grp?`<span class="grp">${e.grp}</span>`:''}</td>${TEAMS.map(t=>`<td class="num">${(S.scores[e.id]||{})[t.id]!=null&&S.scores[e.id][t.id]!==''?sc(e.id,t.id):'–'}</td>`).join('')}</tr>`});
  h+=`<tr class="total"><td>종합점수</td>${TEAMS.map(t=>`<td class="num">${total(t.id)}<span class="grp">${rk.find(r=>r.id===t.id).rank}위</span></td>`).join('')}</tr></tbody>`;
  $('matrix').innerHTML=h;
}
function renderSched(){
  $('dateLbl').textContent=S.date||'';
  let idx=0;
  $('timeline').innerHTML=BLOCKS.map(b=>{
    const first=idx,last=idx+b.steps.length-1;
    const st = S.current>last?'done':(S.current>=first&&S.current<=last?'now':'');
    const chips=b.steps.length>1?`<div class="subs">${b.steps.map((s,i)=>{const k=first+i;return `<span class="chip ${k<S.current?'done':k===S.current?'now':''}">${esc(s.t)}</span>`}).join('')}</div>`:'';
    idx+=b.steps.length;
    return `<div class="step ${st}"><div class="shead"><span class="tt">${esc(b.title)}</span><span class="time num">${b.no}부 · ${b.time}</span></div>${chips}${b.note?`<div class="note">${esc(b.note)}</div>`:''}</div>`;
  }).join('');
}
function renderTeams(){
  const rk=ranking(),any=rk.some(t=>t.score>0);
  $('teamList').innerHTML=TEAMS.map(t=>{const r=rk.find(x=>x.id===t.id);
    const cls=Object.entries(t.cls).map(([g,a])=>`${g} ${a.length>1?a[0]+'~'+a[a.length-1]:a[0]}반`).join(', ');
    return `<div class="team"><div class="top bg-${t.id} ${t.id}"><span class="disp">${t.name}</span><span class="rk">${any?r.rank+'위 · '+r.score+'점':'0점'}</span></div>
    <dl class="body"><dt>학생</dt><dd>${cls}</dd><dt>교직원</dt><dd>${t.staff.join(', ')}</dd></dl></div>`}).join('');
}
function renderNotices(){
  const ns=noticeArr();
  $('noticeAll').innerHTML=ns.length?ns.map(noticeHTML).join(''):'<div class="card" style="color:var(--ink2);font-size:14px">아직 올라온 공지가 없습니다.</div>';
  $('nAdminList').innerHTML=ns.map(n=>`<div class="it"><p>${esc(n.text)} <span style="color:var(--ink2);font-size:12px">${fmtTime(n.time)}</span></p><button data-del="${n.id}">삭제</button></div>`).join('');
}
function renderAdmin(){
  $('stepsAdmin').innerHTML=`<button data-step="-1" class="${S.current<0?'on':''}">대회 시작 전</button>`+
    STEPS.map((s,i)=>`<button data-step="${i}" class="${S.current===i?'on':''}">${s.block.no}부 · ${esc(s.t)} <span style="opacity:.6;font-size:12px">${s.block.time}</span></button>`).join('')+
    `<button data-step="${STEPS.length}" class="${S.current>=STEPS.length?'on':''}">대회 종료</button>`;
  const ae=document.activeElement;
  if(!(ae&&ae.closest&&ae.closest('#scoreGrid'))){
    $('scoreGrid').innerHTML=`<span></span>${TEAMS.map(t=>`<span class="h bg-${t.id} ${t.id}">${t.name}</span>`).join('')}`+
      EVENTS.map(e=>`<span class="ev">${e.name}</span>${TEAMS.map(t=>{const v=(S.scores[e.id]||{})[t.id];return `<input inputmode="numeric" data-ev="${e.id}" data-t="${t.id}" value="${v==null?'':v}" aria-label="${e.name} ${t.name}">`}).join('')}`).join('')+
      `<span class="ev"><b>종합</b></span>${TEAMS.map(t=>`<span class="num" style="text-align:center;font-size:18px;font-weight:700">${total(t.id)}</span>`).join('')}`;
  }
  if(document.activeElement!==$('dateIn'))$('dateIn').value=S.date||'';
}
function renderAll(){renderHome();renderScore();renderSched();renderTeams();renderNotices();renderAdmin()}

/* ---------------- 팀 찾기 ---------------- */
$('fGrade').onchange=()=>{const g=$('fGrade').value;const n=g==='RAA'?6:g?10:0;
  $('fClass').innerHTML='<option value="">반</option>'+Array.from({length:n},(_,i)=>`<option>${i+1}</option>`).join('');$('found').style.display='none'};
$('fClass').onchange=()=>{const g=$('fGrade').value,c=+$('fClass').value;if(!g||!c)return;
  const t=TEAMS.find(t=>(t.cls[g]||[]).includes(c));const f=$('found');
  f.style.display='block';f.style.background=t.color;f.style.color=t.id==='cj'?'var(--cj-t)':'#fff';
  f.innerHTML=`${g} ${c}반은 <span class="disp" style="font-size:22px">${t.name}</span> 팀입니다`};

/* ---------------- 화면 전환 ---------------- */
$('admEntry').onclick=()=>go('admin');
function go(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.go===v));window.scrollTo(0,0)}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)go(g.dataset.go)});
function route(){if(location.hash==='#admin'){go('admin')}}
window.addEventListener('hashchange',route);

/* ---------------- 알림 ---------------- */
let seen=null;
function toast(n){const t=$('toast');t.innerHTML=`<b>${n.level==='urgent'?'긴급 공지':'새 공지'}</b>${esc(n.text)}`;t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),n.level==='urgent'?9000:6000);
  if(navigator.vibrate)navigator.vibrate(n.level==='urgent'?[200,100,200]:120);
  if('Notification'in window&&Notification.permission==='granted'&&document.hidden){try{new Notification('KSA 체육대회 '+(n.level==='urgent'?'긴급 공지':'공지'),{body:n.text,tag:n.id})}catch(_){}}}
function checkNew(){const ns=noticeArr();if(seen===null){seen=new Set(ns.map(n=>n.id));return}
  ns.filter(n=>!seen.has(n.id)).reverse().forEach(n=>{seen.add(n.id);toast(n)})}
function bellState(){if(!('Notification'in window)){$('bellBtn').textContent='화면 알림 사용';$('bellBtn').disabled=true;return}
  if(Notification.permission==='granted'){$('bellBox').querySelector('span').textContent='알림이 켜져 있습니다. 이 페이지를 열어 두면 새 공지를 알려 드립니다.';$('bellBtn').style.display='none'}}
$('bellBtn').onclick=async()=>{try{await Notification.requestPermission()}catch(_){}bellState()};

/* ---------------- 데이터 계층: Firebase 또는 체험 모드 ---------------- */
const CFG=window.FIREBASE_CONFIG||{};
const LIVE=!!(CFG.apiKey&&CFG.databaseURL);
let DB=null,AUTH=null,isAdmin=false;
const ROOT='ksa2026';
function apply(v){v=v||{};S={current:v.current??-1,scores:v.scores||{},notices:v.notices||{},date:v.date||'',updated:v.updated||0};renderAll();checkNew()}
function setConn(on,txt){$('conn').classList.toggle('on',on);$('conn').querySelector('span').textContent=txt}

const store = LIVE ? {
  async init(){
    const load=src=>new Promise((r,j)=>{const s=document.createElement('script');s.src=src;s.onload=r;s.onerror=j;document.head.appendChild(s)});
    const base='https://www.gstatic.com/firebasejs/10.12.2/';
    await load(base+'firebase-app-compat.js');await load(base+'firebase-database-compat.js');await load(base+'firebase-auth-compat.js');
    firebase.initializeApp(CFG);DB=firebase.database();AUTH=firebase.auth();
    DB.ref(ROOT).on('value',s=>apply(s.val()));
    DB.ref('.info/connected').on('value',s=>setConn(!!s.val(),s.val()?'실시간 연결됨':'재연결 중'));
    AUTH.onAuthStateChanged(u=>{isAdmin=!!u;adminView()});
  },
  set(path,val){return DB.ref(ROOT+'/'+path).set(val).then(()=>DB.ref(ROOT+'/updated').set(firebase.database.ServerValue.TIMESTAMP))},
  push(path,val){return DB.ref(ROOT+'/'+path).push({...val,time:firebase.database.ServerValue.TIMESTAMP})},
  remove(path){return DB.ref(ROOT+'/'+path).remove()},
  async login(){await AUTH.signInWithEmailAndPassword($('aEmail').value.trim(),$('aPw').value)},
  logout(){return AUTH.signOut()}
} : {
  KEY:'ksa2026-demo',
  read(){try{return JSON.parse(localStorage.getItem(this.KEY))||{}}catch(_){return{}}},
  write(v){v.updated=Date.now();localStorage.setItem(this.KEY,JSON.stringify(v));apply(v)},
  async init(){apply(this.read());window.addEventListener('storage',e=>{if(e.key===this.KEY)apply(this.read())});
    setConn(false,'체험 모드');isAdmin=sessionStorage.getItem('ksa-admin')==='1';adminView()},
  set(path,val){const v=this.read();const k=path.split('/');let o=v;for(let i=0;i<k.length-1;i++){o[k[i]]=o[k[i]]||{};o=o[k[i]]}
    if(val===null)delete o[k[k.length-1]];else o[k[k.length-1]]=val;this.write(v);return Promise.resolve()},
  push(path,val){return this.set(path+'/n'+Date.now(),{...val,time:Date.now()})},
  remove(path){return this.set(path,null)},
  async login(){if($('aPin').value!=='2026')throw new Error('PIN이 맞지 않습니다.');sessionStorage.setItem('ksa-admin','1');isAdmin=true;adminView()},
  logout(){sessionStorage.removeItem('ksa-admin');isAdmin=false;adminView()}
};

function adminView(){
  $('loginFb').style.display=LIVE?'':'none';$('loginDemo').style.display=LIVE?'none':'';
  $('modeBox').innerHTML=LIVE?'<div class="mode">실시간 모드 — 여기서 바꾼 내용이 접속한 모든 휴대폰에 즉시 반영됩니다.</div>'
    :'<div class="mode demo">체험 모드 — 이 기기(같은 브라우저의 다른 탭 포함)에서만 반영됩니다. 실제 대회에서는 파일 상단에 Firebase 설정값을 넣어 주세요. 체험 PIN: 2026</div>';
  $('loginBox').style.display=isAdmin?'none':'';$('adminBox').style.display=isAdmin?'':'none';
}
$('loginBtn').onclick=async()=>{$('loginErr').textContent='';try{await store.login()}catch(e){$('loginErr').textContent='로그인 실패: '+(e.message||e)}};
$('logout').onclick=()=>store.logout();
const setStep=i=>store.set('current',Math.max(-1,Math.min(STEPS.length,i)));
$('stepsAdmin').onclick=e=>{const b=e.target.closest('[data-step]');if(b)setStep(+b.dataset.step)};
$('nextStep').onclick=()=>setStep(S.current+1);
$('prevStep').onclick=()=>setStep(S.current-1);
$('scoreGrid').addEventListener('change',e=>{const i=e.target;if(!i.dataset.ev)return;
  const v=i.value.trim();if(v!==''&&isNaN(+v)){i.value='';return}
  store.set(`scores/${i.dataset.ev}/${i.dataset.t}`,v===''?null:+v)});
$('nSend').onclick=async()=>{const t=$('nText').value.trim();if(!t)return;await store.push('notices',{text:t,level:$('nLevel').value});$('nText').value=''};
$('nAdminList').onclick=e=>{const b=e.target.closest('[data-del]');if(b&&confirm('이 공지를 삭제할까요?'))store.remove('notices/'+b.dataset.del)};
$('dateSave').onclick=()=>store.set('date',$('dateIn').value.trim());
$('resetAll').onclick=()=>{if(confirm('모든 점수와 공지, 진행 단계를 초기화합니다. 계속할까요?')){store.set('scores',null);store.set('notices',null);store.set('current',-1)}};

renderAll();bellState();route();
store.init().catch(e=>{setConn(false,'연결 실패');console.error(e)});
</script>
